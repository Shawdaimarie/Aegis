name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-security-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aegis/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify independent console controls
        run: node --test tests/web/*.test.cjs
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Resolve development environment
        run: uv sync --all-extras
      - name: Run complete verification gate
        run: make check
      - name: Build wheel and source distribution
        run: uv build
      - name: Upload coverage and package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-verification-evidence
          path: |
            aegis/.coverage
            aegis/htmlcov/
            aegis/dist/
          if-no-files-found: warn

  container-build:
    runs-on: ubuntu-latest
    needs: quality-security-and-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build non-root Aegis image
        run: docker build --progress=plain -t aegis:ci aegis
