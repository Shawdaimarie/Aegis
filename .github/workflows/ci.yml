name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-security-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aegis/pyproject.toml
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Resolve development environment
        run: uv sync --all-extras
      - name: Run complete verification gate
        run: make check
      - name: Build wheel and source distribution
        run: uv build
      - name: Upload coverage and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-verification-evidence
          path: |
            aegis/.coverage
            aegis/htmlcov/
            aegis/dist/
          if-no-files-found: warn

  container-build:
    runs-on: ubuntu-latest
    needs: quality-security-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root Aegis image
        run: docker build --progress=plain -t aegis:ci aegis
