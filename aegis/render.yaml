# Connect the repository in Render. Keep generated values private and environment-specific.
services:
  - type: web
    name: aegis-console
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AEGIS_API_TOKEN
        generateValue: true
      - key: AEGIS_CAPABILITY_SIGNING_KEY
        generateValue: true
